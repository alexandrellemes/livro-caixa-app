name: livro_caixa_app
description: App Flutter para a API REST v1 do Livro Caixa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: any
  material_ui: ^1.11.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#1B6E4F"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: false
  web:
    generate: true
    background_color: "#1B6E4F"
    theme_color: "#1B6E4F"
